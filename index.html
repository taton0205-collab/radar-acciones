<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de Acciones</title>
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #14171c; --muted: #6a7280;
    --line: #e3e6eb; --accent: #0f9d6b; --accent-soft: #e2f4ec;
    --mid: #c98a12; --low: #d4443b; --chip: #eceff3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --text: #e8ebf0; --muted: #8b93a1;
      --line: #252b35; --accent: #2fc98d; --accent-soft: #15302a;
      --mid: #e0a83a; --low: #ef6a60; --chip: #212732;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
  header { padding: 22px 0 6px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .controls { position: sticky; top: 0; background: var(--bg); padding: 10px 0 8px; z-index: 5; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: none; color: var(--muted); font: inherit;
    font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  input[type=search] {
    width: 100%; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
  }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 0; background: var(--chip); color: var(--text); font: inherit;
    font-size: 13px; padding: 6px 12px; border-radius: 99px; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #fff; }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .rank { width: 22px; color: var(--muted); font-size: 13px; text-align: right; flex: none; }
  .info { flex: 1; min-width: 0; }
  .tk { font-weight: 700; font-size: 16px; }
  .name { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars { display: flex; gap: 10px; margin-top: 6px; }
  .mini { flex: 1; font-size: 11px; color: var(--muted); }
  .track { height: 4px; background: var(--chip); border-radius: 4px; margin-top: 3px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .chg { font-size: 12px; font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--accent); } .chg.down { color: var(--low); } .chg.eq { color: var(--muted); }
  .new { font-size: 10px; font-weight: 800; letter-spacing: .04em; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
  .hist { background: var(--bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .hist .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .hist .top b { color: var(--text); font-size: 13px; }
  .hist svg { width: 100%; height: 60px; display: block; }
  .hist .ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .score {
    flex: none; width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center;
    font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .detail { display: none; border-top: 1px solid var(--line); padding: 12px 14px 14px; }
  .card.open .detail { display: block; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kv { background: var(--bg); border-radius: 8px; padding: 8px; }
  .kv b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .kv span { color: var(--muted); font-size: 11px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .crit { display: grid; grid-template-columns: 120px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
  .crit .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .links { display: flex; gap: 8px; margin-top: 12px; }
  .links a, .links button {
    flex: 1; text-align: center; padding: 9px; border-radius: 10px; background: var(--chip);
    color: var(--text); text-decoration: none; font-size: 13px; font-weight: 600;
    border: 0; font-family: inherit; cursor: pointer;
  }
  .links .news-btn { background: var(--accent-soft); color: var(--accent); }
  .ctabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .ctabs button {
    flex: 1; border: 0; background: var(--chip); color: var(--muted); font: inherit; font-size: 13px;
    font-weight: 600; padding: 8px; border-radius: 9px; cursor: pointer;
  }
  .ctabs button.on { background: var(--accent); color: #fff; }
  .pane { display: none; }
  .pane.on { display: block; }
  .cnews a {
    display: block; padding: 10px 0; border-bottom: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: 14px; line-height: 1.35;
  }
  .cnews a:last-child { border-bottom: 0; }
  .cnews .cn { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 4px; }
  .cnews .cn:last-child { border-bottom: 0; }
  .cnews small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .why { background: var(--bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
  .why .res { font-weight: 600; margin-bottom: 8px; }
  .why ul { list-style: none; margin: 0; padding: 0; }
  .why li { display: flex; gap: 8px; padding: 3px 0; }
  .why li i { font-style: normal; flex: none; width: 18px; text-align: center; font-weight: 700; }
  .why li.ok i { color: var(--accent); }
  .why li.bad i { color: var(--low); }
  .why li small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .why .conc { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .why .conc b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .why .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 8px 0 2px; }
  .cnews .none { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .news a {
    display: block; padding: 9px 0; border-bottom: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: 14px; line-height: 1.35;
  }
  .news a:last-child { border-bottom: 0; }
  .news small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .news .none { color: var(--muted); font-size: 13px; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 0; }
  .view { display: none; }
  .view.on { display: block; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px;
    font-weight: 600; padding: 8px 0 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button.on { color: var(--accent); }
  body { padding-bottom: 70px; }
  .feed { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .nitem {
    display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; color: var(--text); text-decoration: none; line-height: 1.35;
  }
  .nitem .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .badge { background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .nitem .t { font-size: 15px; font-weight: 500; color: var(--text); text-decoration: none; display: block; }
  .ia { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
  .sent { font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .sent.buena { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .sent.mala { background: color-mix(in srgb, var(--low) 16%, transparent); color: var(--low); }
  .sent.neutra { background: var(--chip); color: var(--muted); }
  .imp { color: var(--muted); }
  .explicame { margin-left: auto; border: 0; background: var(--chip); color: var(--text); font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .expl { display: none; margin-top: 8px; padding: 10px; border-radius: 8px; background: var(--chip); font-size: 13px; line-height: 1.45; }
  .expl.on { display: block; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
  .resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 12px; }
  .resumen .kv { background: var(--card); border: 1px solid var(--line); }
  .resumen .kv b { font-size: 18px; }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ph .tk { font-size: 17px; }
  .ph .pr { text-align: right; font-variant-numeric: tabular-nums; }
  .ph .pr b { display: block; font-size: 17px; }
  .ph .pr span { font-size: 12px; }
  .up { color: var(--accent); } .down { color: var(--low); }
  .gan { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .gan b { color: var(--text); font-variant-numeric: tabular-nums; }
  .gan b.up { color: var(--accent); } .gan b.down { color: var(--low); }
  .rango .mk.izq::after { left: -4px; transform: none; }
  .rango .mk.der::after { left: auto; right: -4px; transform: none; }
  .rango { position: relative; height: 8px; border-radius: 8px; margin: 26px 0 6px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--low) 55%, transparent), var(--chip) 45%, var(--chip) 55%, color-mix(in srgb, var(--accent) 55%, transparent)); }
  .rango .mk { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: 3px solid var(--card); }
  .rango .mk::after { content: attr(data-l); position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; color: var(--text); }
  .rango .ppc { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--muted); }
  .rlbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rlbl .c { text-align: center; }
  .estado { margin-top: 10px; font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 8px; background: var(--chip); }
  .estado.ok { background: var(--accent-soft); color: var(--accent); }
  .estado.bad { background: color-mix(in srgb, var(--low) 16%, transparent); color: var(--low); }
  .estado.warn { background: color-mix(in srgb, var(--mid) 18%, transparent); color: var(--mid); }
  .arow { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 6px; font-size: 14px; }
  .arow small { display: block; color: var(--muted); font-size: 12px; }
  .btn { display: block; text-align: center; padding: 11px; border-radius: 10px; background: var(--chip); color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; margin-top: 12px; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; }
  .modal.on { display: flex; }
  .modal .hoja { background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .modal h2 { margin: 0 0 12px; font-size: 19px; }
  .campo { margin-bottom: 10px; }
  .campo label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  .campo small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acciones { display: flex; gap: 8px; margin-top: 14px; }
  .acciones button { flex: 1; border: 0; padding: 12px; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; background: var(--chip); color: var(--text); }
  .acciones .pri { background: var(--accent); color: #fff; }
  .botones { display: flex; gap: 8px; margin: 4px 0 10px; }
  .botones button { flex: 1; border: 0; padding: 12px; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; }
  .b-compra { background: var(--accent); color: #fff; }
  .b-venta { background: var(--chip); color: var(--text); }
  .mini-acc { display: flex; gap: 6px; margin-top: 10px; }
  .mini-acc button { flex: 1; border: 0; background: var(--chip); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; padding: 8px; border-radius: 9px; cursor: pointer; }
  .mov { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mov:last-child { border-bottom: 0; }
  .mov small { display: block; color: var(--muted); font-size: 12px; }
  .mov button { border: 0; background: none; font-size: 17px; cursor: pointer; padding: 4px 8px; }
  .split { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .split b { font-variant-numeric: tabular-nums; }
  .sug { font-size: 11px; color: var(--muted); font-weight: 400; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .crit { grid-template-columns: 100px 1fr 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Radar de Acciones</h1>
    <div class="sub" id="sub">Cargando…</div>
  </header>

  <section class="view on" id="vRanking">
  <div class="controls">
    <div class="seg">
      <button id="bTop" class="on">Top diversificado</button>
      <button id="bAll">Todas</button>
    </div>
    <input type="search" id="q" placeholder="Buscar ticker o empresa…">
    <div class="chips" id="chips"></div>
  </div>

  <div class="list" id="list"><div class="msg">Cargando datos…</div></div>
  </section>

  <section class="view" id="vNoticias">
    <div class="controls">
      <div class="chips" id="nchips"></div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <section class="view" id="vCartera">
    <div id="cartera"><div class="msg">Cargando…</div></div>
  </section>

  <footer>Herramienta para filtrar candidatas, no es una recomendación de compra.<br>Datos de Yahoo Finance.</footer>
</div>

<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>

<nav class="tabbar">
  <button id="tRanking" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Ranking
  </button>
  <button id="tNoticias">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 17h3"/></svg>
    Noticias
  </button>
  <button id="tCartera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.3" fill="currentColor"/></svg>
    Cartera
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const TOP_N = 15;
let datos = [], maxSector = 3, modo = "top", sector = "Todos", busqueda = "";
let abiertos = new Set();

const $ = (id) => document.getElementById(id);
const colorNota = (n) => n >= 75 ? "var(--accent)" : n >= 50 ? "var(--mid)" : "var(--low)";
const fmt = (v, suf = "") => (v === null || v === undefined) ? "–" : (Math.round(v * 10) / 10).toLocaleString("es-AR") + suf;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const NOMBRES = {
  "P/E": "P/E", "ROE": "ROE", "Deuda/Pat": "Deuda/Patrimonio",
  "Crec. ingresos": "Crec. ingresos", "Crec. ganancias": "Crec. ganancias",
  "FCF positivo": "Flujo de caja", "Precio>SMA200": "Tendencia (SMA200)",
  "SMA50>SMA200": "Cruce SMA50/200", "RSI en zona": "RSI", "Volumen en alza": "Volumen", "Cruce reciente": "Cruce reciente 🔥",
};
const FUND = ["P/E", "ROE", "Deuda/Pat", "Crec. ingresos", "Crec. ganancias", "FCF positivo"];
const ARG = "🇦🇷 Argentina", ETF = "📦 ETFs";
const TEC = ["Precio>SMA200", "SMA50>SMA200", "RSI en zona", "Volumen en alza", "Cruce reciente"];

function lista() {
  let l = datos.map((d, i) => ({ ...d, puesto: i + 1 }));
  if (modo === "top" && sector === "Todos" && !busqueda) {
    const cuenta = {};
    l = l.filter((d) => {
      cuenta[d.Sector] = (cuenta[d.Sector] || 0) + 1;
      return maxSector <= 0 || cuenta[d.Sector] <= maxSector;
    }).slice(0, TOP_N);
  }
  if (sector === ARG) l = l.filter((d) => d.Mercado === "Argentina");
  else if (sector === ETF) l = l.filter((d) => d.Mercado === "ETF");
  else if (sector !== "Todos") l = l.filter((d) => d.Sector === sector);
  if (busqueda) {
    const q = busqueda.toLowerCase();
    l = l.filter((d) => d.Ticker.toLowerCase().includes(q) || (d.Empresa || "").toLowerCase().includes(q));
  }
  return l;
}

function barra(etq, n) {
  return `<div class="mini">${etq} ${n}<div class="track"><div class="fill" style="width:${n}%;background:${colorNota(n)}"></div></div></div>`;
}

function criterios(claves, notas) {
  return claves.map((k) => {
    const n = notas?.[k] ?? 0;
    return `<div class="crit"><span>${NOMBRES[k]}</span><div class="track"><div class="fill" style="width:${n}%;background:${colorNota(n)}"></div></div><span class="n">${n}</span></div>`;
  }).join("");
}

function hace(fecha) {
  const t = Date.parse(fecha);
  if (!t) return "";
  const h = Math.round((Date.now() - t) / 36e5);
  if (h < 1) return "hace minutos";
  if (h < 24) return `hace ${h} h`;
  const dias = Math.round(h / 24);
  return dias === 1 ? "hace 1 día" : `hace ${dias} días`;
}

let filtroNoticias = "Todas";

let cargandoMias = false;
async function cargarMias() {
  if (cargandoMias || !sesion || !perfil?.aprobado) return;
  cargandoMias = true;
  const [r1, r2] = await Promise.all([
    ops.length ? null : sb.from("operaciones").select("*").order("fecha"),
    seguidas.length ? null : sb.from("seguimiento").select("*"),
    precios ? null : cargarPrecios(),
  ]);
  if (r1?.data) ops = r1.data;
  if (r2?.data) seguidas = r2.data;
  renderNoticias();
}

function renderNoticias() {
  if (sesion && (!precios || (!ops.length && !seguidas.length)) && !cargandoMias) cargarMias();
  // Tus acciones (cartera + seguimiento)
  const cant = {};
  for (const o of ops) cant[o.ticker] = (cant[o.ticker] || 0) + (o.tipo === "compra" ? +o.cantidad : -o.cantidad);
  const mias = new Set([...Object.keys(cant).filter((t) => cant[t] > 1e-9), ...seguidas.map((x) => x.ticker)]);

    for (const n of lista || []) if (n.url && !arr.some((x) => x.url === n.url || x.titulo === n.titulo)) arr.push(n);
  };
  datos.forEach((d) => sumar(d.Ticker, d.Noticias));
  mias.forEach((t) => sumar(t, precios?.tickers?.[t]?.noticias));

  });
  items.sort((a, b) => (Date.parse(b.fecha) || 0) - (Date.parse(a.fecha) || 0));
  $("feed").innerHTML = items.length
    ? items.slice(0, 150).map((n) => `<div class="nitem">

}

// ================= MI CARTERA =================
const SUG_VENTA = 25, SUG_STOP = 10;   // % sugeridos sobre el PPC
let precios = null, ops = [], objs = {}, posiciones = [], seguidas = [], notas = {};
const BROKERS = ["IOL", "Balanz", "Cocos", "Bull Market", "PPI", "Allaria", "Otro"];
let ultimoBroker = "";
try { ultimoBroker = localStorage.getItem("ultimoBroker") || ""; } catch {}
const selBroker = (id, valor) => `<select id="${id}"><option value="">— Elegí —</option>${BROKERS.map((b) => `<option${b === valor ? " selected" : ""}>${b}</option>`).join("")}</select>`;

const ars = (v, dec) => v == null ? "–" : "$ " + Number(v).toLocaleString("es-AR", { minimumFractionDigits: dec ?? (Math.abs(v) >= 1000 ? 0 : 2), maximumFractionDigits: dec ?? (Math.abs(v) >= 1000 ? 0 : 2) });
const pctTxt = (v) => v == null ? "–" : (v >= 0 ? "+" : "") + num(v) + "%";
const clsSigno = (v) => v == null ? "" : v >= 0 ? "up" : "down";
const hoyISO = () => new Date(Date.now() - 3 * 36e5).toISOString().slice(0, 10);

async function cargarPrecios() {
  try { const r = await fetch("precios.json?v=" + Date.now()); precios = r.ok ? await r.json() : null; }
  catch { precios = null; }
}

// Valor de una serie {fecha: valor} en una fecha (o el último día hábil anterior)
function valorEn(serie, fecha) {
  if (!serie) return null;
  if (serie[fecha] != null) return serie[fecha];
  let mejor = null;
  for (const f in serie) if (f <= fecha && (!mejor || f > mejor)) mejor = f;
  return mejor ? serie[mejor] : null;
}

function calcularPosiciones() {
  const pos = {};
  const orden = [...ops].sort((a, b) => a.fecha === b.fecha ? a.id - b.id : a.fecha < b.fecha ? -1 : 1);
  for (const o of orden) {
    const p = pos[o.ticker] ||= { ticker: o.ticker, cant: 0, costo: 0, realizado: 0, compras: [], movs: [] };
    const cant = +o.cantidad, precio = +o.precio, com = +o.comision;
    p.movs.push(o);
    if (o.tipo === "compra") { p.cant += cant; p.costo += cant * precio + com; p.compras.push(o); }
    else {
      const ppc = p.cant ? p.costo / p.cant : 0, q = Math.min(cant, p.cant);
      p.realizado += q * precio - com - q * ppc;
      p.costo -= q * ppc; p.cant -= q;
    }
  }
  return Object.values(pos).map((p) => {
    const pr = precios?.tickers?.[p.ticker] || {};
    p.ppc = p.cant > 0 ? p.costo / p.cant : null;
    p.precio = pr.ars ?? null;
    p.varDia = pr.ars && pr.ars_prev ? (pr.ars / pr.ars_prev - 1) * 100 : null;
    p.valor = p.precio != null ? p.precio * p.cant : null;
    p.gan = p.valor != null ? p.valor - p.costo : null;
    p.ganPct = p.gan != null && p.costo ? p.gan / p.costo * 100 : null;
    // Cuánto vino de la acción y cuánto del dólar CCL (promedio ponderado de las compras)
    let peso = 0, usdC = 0, cclC = 0;
    for (const c of p.compras) {
      const u = valorEn(pr.usd_hist, c.fecha), k = valorEn(precios?.ccl_hist, c.fecha);
      if (u == null || k == null) { peso = 0; break; }
      const w = c.cantidad * c.precio; peso += w; usdC += u * w; cclC += k * w;
    }
    if (peso && pr.usd && precios?.ccl && p.cant > 0) {
      p.efAccion = (pr.usd / (usdC / peso) - 1) * 100;
      p.efDolar = (precios.ccl / (cclC / peso) - 1) * 100;
    }
    const ob = objs[p.ticker] || {};
    p.sugerido = !ob.vender_en && !ob.stop && ob.stop_tipo !== "dinamico";
    p.objetivo = ob.vender_en ? +ob.vender_en : p.ppc ? p.ppc * (1 + SUG_VENTA / 100) : null;
    p.dinamico = ob.stop_tipo === "dinamico" && ob.stop_pct;
    if (p.dinamico) {
      p.maximo = Math.max(+ob.max_precio || 0, p.ppc || 0, p.precio || 0);
      p.stop = p.maximo * (1 - ob.stop_pct / 100);
    } else {
      p.stop = ob.stop ? +ob.stop : p.ppc ? p.ppc * (1 - SUG_STOP / 100) : null;
    }
    p.situacion = "normal";
    if (p.precio != null) {
      if (p.objetivo && p.precio >= p.objetivo) p.situacion = "objetivo";
      else if (p.objetivo && p.precio >= p.objetivo * 0.97) p.situacion = "cerca_objetivo";
      if (p.stop && p.precio <= p.stop) p.situacion = "stop";
      else if (p.stop && p.precio <= p.stop * 1.03 && p.situacion === "normal") p.situacion = "cerca_stop";
    }
    p.nota = datos.find((a) => a.Ticker === p.ticker)?.Puntaje ?? null;
    return p;
  }).sort((a, b) => (b.valor ?? 0) - (a.valor ?? 0));
}

// ---------- Gráfico: cuánto valía tu cartera cada día ----------
let periodoGraf = "3M";
try { periodoGraf = localStorage.getItem("periodoGraf") || "3M"; } catch {}
const PERIODOS = { "1M": 30, "3M": 91, "6M": 182, "1A": 365, "Todo": 1e5 };

function precioEnFecha(t, fecha, ultimaOp) {
  const pr = precios?.tickers?.[t] || {};
  const hist = pr.ars_hist || {};
  const fechasH = Object.keys(hist).sort();
  if (fecha >= hoyISO() && pr.ars) return pr.ars;
  if (fechasH.length && fecha >= fechasH[0]) return valorEn(hist, fecha);
  // Antes de que existiera el historial en pesos: lo estimamos con el precio en dólares y el CCL
  const conocido = datos.some((a) => a.Ticker === t);
  const u = valorEn(pr.usd_hist, fecha), k = valorEn(precios?.ccl_hist, fecha);
  if (conocido && pr.ars && pr.usd && precios?.ccl && u && k) return pr.ars / (pr.usd * precios.ccl) * u * k;
  return ultimaOp ?? (fechasH.length ? hist[fechasH[0]] : pr.ars) ?? null;
}

function serieCartera() {
  if (!ops.length || !precios) return [];
  const orden = [...ops].sort((a, b) => a.fecha === b.fecha ? a.id - b.id : a.fecha < b.fecha ? -1 : 1);
  const hoy = hoyISO();
  const fechas = [...new Set([...Object.keys(precios.ccl_hist || {}), hoy])].filter((f) => f >= orden[0].fecha && f <= hoy).sort();
  const pos = {}, ultPrecio = {};
  let i = 0;
  const salida = [];
  for (const f of fechas) {
    while (i < orden.length && orden[i].fecha <= f) {
      const o = orden[i++], p = pos[o.ticker] ||= { cant: 0, costo: 0 };
      const cant = +o.cantidad, precio = +o.precio;
      ultPrecio[o.ticker] = precio;
      if (o.tipo === "compra") { p.cant += cant; p.costo += cant * precio + (+o.comision || 0); }
      else { const ppc = p.cant ? p.costo / p.cant : 0, q = Math.min(cant, p.cant); p.costo -= q * ppc; p.cant -= q; }
    }
    let valor = 0, inv = 0, ok = true;
    for (const t in pos) {
      if (pos[t].cant <= 1e-9) continue;
      const pr = precioEnFecha(t, f, ultPrecio[t]);
      if (pr == null) { ok = false; break; }
      valor += pr * pos[t].cant; inv += pos[t].costo;
    }
    if (ok && inv > 0) salida.push([f, valor, inv]);
  }
  return salida;
}

function graficoCartera() {
  const todo = serieCartera();
  if (todo.length < 2) return "";
  const desde = new Date(Date.now() - 3 * 36e5 - PERIODOS[periodoGraf] * 864e5).toISOString().slice(0, 10);
  const s = todo.filter((x) => x[0] >= desde);
  if (s.length < 2) return "";
  const vals = s.flatMap((x) => [x[1], x[2]]);
  const min = Math.min(...vals), max = Math.max(...vals), W = 300, H = 90;
  const X = (i) => (i / (s.length - 1) * W).toFixed(1), Y = (v) => (H - (v - min) / (max - min || 1) * H).toFixed(1);
  const lv = s.map((x, i) => `${X(i)},${Y(x[1])}`).join(" ");
  const li = s.map((x, i) => `${X(i)},${Y(x[2])}`).join(" ");
  const ini = s[0], fin = s[s.length - 1];
  // Cambio en el período sin contar la plata que agregaste o sacaste
  const cambio = (fin[1] - fin[2]) - (ini[1] - ini[2]);
  const color = cambio >= 0 ? "var(--accent)" : "var(--low)";
  const fc = (iso) => { const [, m, d] = iso.split("-"); return `${d}/${m}`; };
  return `<div class="hist" id="grafCartera" style="margin-bottom:12px">
    <div class="top"><span>Evolución de tu cartera</span><b class="${clsSigno(cambio)}">${cambio >= 0 ? "+" : "−"}${ars(Math.abs(cambio))}</b></div>
    <div class="chips" style="padding:4px 0 8px">${Object.keys(PERIODOS).map((k) => `<button class="chip${k === periodoGraf ? " on" : ""}" data-per="${k}">${k}</button>`).join("")}</div>
    <svg viewBox="-4 -4 ${W + 8} ${H + 8}" preserveAspectRatio="none" style="height:110px">
      <polyline points="${li}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <polyline points="${lv}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="ax"><span>${fc(ini[0])}</span><span>${fc(fin[0])}</span></div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">— Valor de tu cartera &nbsp; - - Lo que pusiste</div>
  </div>`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("#grafCartera [data-per]");
  if (!b) return;
  periodoGraf = b.dataset.per;
  try { localStorage.setItem("periodoGraf", periodoGraf); } catch {}
  $("grafCartera").outerHTML = graficoCartera();
});

// ---------- Cuánto tenés en cada broker ----------
function porBroker(abiertas) {
  const tot = {};
  for (const p of abiertas) {
    if (p.precio == null) continue;
    const cant = {};
    for (const o of p.movs) {
      const b = o.broker || "Sin especificar";
      cant[b] = (cant[b] || 0) + (o.tipo === "compra" ? +o.cantidad : -o.cantidad);
    }
    for (const b in cant) if (cant[b] > 1e-9) tot[b] = (tot[b] || 0) + cant[b] * p.precio;
  }
  const lista = Object.entries(tot).sort((a, b) => b[1] - a[1]);
  if (!lista.length || (lista.length === 1 && lista[0][0] === "Sin especificar")) return "";
  const total = lista.reduce((s, x) => s + x[1], 0);
  return `<div class="hist" style="margin-bottom:12px">
    <div class="top"><span>🏦 Cuánto tenés en cada broker</span></div>
    ${lista.map(([b, v]) => `<div class="crit"><span>${esc(b)}</span><div class="track"><div class="fill" style="width:${(v / total * 100).toFixed(1)}%;background:${b === "Sin especificar" ? "var(--muted)" : "var(--accent)"}"></div></div><span class="n">${Math.round(v / total * 100)}%</span></div>
      <div style="font-size:12px;color:var(--muted);margin:-2px 0 6px">${ars(v)}</div>`).join("")}
  </div>`;
}

// ---------- Distribución: cuánto pesa cada acción en tu cartera ----------
const MAX_PESO = 25;   // % máximo recomendado por acción
function distribucion(abiertas) {
  const con = abiertas.filter((p) => p.valor != null && p.valor > 0);
  const total = con.reduce((s, p) => s + p.valor, 0);
  if (con.length < 2 || !total) return "";
  const filas = con.map((p) => ({ t: p.ticker, pct: p.valor / total * 100, valor: p.valor })).sort((a, b) => b.pct - a.pct);
  const altas = filas.filter((f) => f.pct > MAX_PESO);
  const aviso = altas.map((f) => {
    const vender = f.valor - total * MAX_PESO / 100;
    return `<div class="estado bad" style="margin:0 0 8px">⚠️ <b>${esc(f.t)}</b> es el ${num(f.pct)}% de tu cartera. Para bajarla al ${MAX_PESO}% tendrías que vender unos ${ars(vender)}, o comprar otras acciones.</div>`;
  }).join("");
  const top = filas.slice(0, 8), resto = filas.slice(8).reduce((s, f) => s + f.pct, 0);
  if (resto > 0) top.push({ t: "Otras", pct: resto, n: filas.length - 8 });
  return `<div class="hist" style="margin-bottom:12px">
    <div class="top"><span>Cuánto pesa cada acción</span><b>${altas.length ? "⚠️ concentrada" : "✅ diversificada"}</b></div>
    ${aviso}
    ${top.map((f) => `<div class="crit"><span>${esc(f.t)}${f.n ? ` (${f.n})` : ""}</span><div class="track"><div class="fill" style="width:${Math.min(100, f.pct * 2)}%;background:${f.t === "Otras" ? "var(--muted)" : f.pct > MAX_PESO ? "var(--low)" : "var(--accent)"}"></div></div><span class="n">${Math.round(f.pct)}%</span></div>`).join("")}
    <div style="font-size:12px;color:var(--muted);margin-top:6px">Recomendado: ninguna acción arriba del ${MAX_PESO}%.</div>
  </div>`;
}

async function renderMiCartera() {
  const box = $("carteraBox");
  const [r1, r2, r3, , r4] = await Promise.all([
    sb.from("operaciones").select("*").order("fecha"),
    sb.from("objetivos").select("*"),
    sb.from("seguimiento").select("*").order("creado"),
    cargarPrecios(),
    sb.from("notas_accion").select("*"),
  ]);
  notas = Object.fromEntries((r4?.data || []).map((n) => [n.ticker, n.texto]));
  seguidas = r3?.data || [];
  if (r1.error) { box.innerHTML = `<div class="msg">Error: ${esc(r1.error.message)}</div>`; return; }
  ops = r1.data || [];
  objs = Object.fromEntries((r2.data || []).map((o) => [o.ticker, o]));
  posiciones = calcularPosiciones();

  const abiertas = posiciones.filter((p) => p.cant > 0);
  const cerradas = posiciones.filter((p) => p.cant <= 0);
  const conPrecio = abiertas.filter((p) => p.valor != null);
  const invertido = conPrecio.reduce((s, p) => s + p.costo, 0);
  const valor = conPrecio.reduce((s, p) => s + p.valor, 0);
  const noReal = valor - invertido;
  const realizado = posiciones.reduce((s, p) => s + p.realizado, 0);

  let html = `<div class="botones">
      <button class="b-compra" id="btnCompra">+ Compra</button>
      <button class="b-venta" id="btnVenta">− Venta</button>
    </div>`;

  if (!ops.length) {
    box.innerHTML = html + `<div class="msg">Todavía no cargaste operaciones.<br>Tocá <b>+ Compra</b> para cargar tu primer CEDEAR.</div>` + seccionSeguimiento();
    conectarBotones(); return;
  }

  html += `<div class="resumen">
      <div class="kv"><b>${ars(valor)}</b><span>Valor actual</span></div>
      <div class="kv"><b class="${clsSigno(noReal)}">${noReal >= 0 ? "+" : "−"}${ars(Math.abs(noReal))}</b><span>Ganancia (${pctTxt(invertido ? noReal / invertido * 100 : 0)})</span></div>
      <div class="kv"><b>${ars(invertido)}</b><span>Invertido</span></div>
      <div class="kv"><b class="${clsSigno(realizado)}">${realizado >= 0 ? "+" : "−"}${ars(Math.abs(realizado))}</b><span>Ganancia ya realizada</span></div>
    </div>`;
  html += graficoCartera();
  html += distribucion(abiertas);
  html += porBroker(abiertas);
  if (precios?.ccl) html += `<div class="sub" style="margin:-4px 0 10px">Dólar CCL: <b>${ars(precios.ccl, 2)}</b> · precios ${esc(precios.actualizado || "")}</div>`;

  html += abiertas.map(tarjetaPos).join("");
  if (cerradas.length) html += `<h3>Vendidas</h3>` + cerradas.map((p) => `<div class="arow"><span><b>${esc(p.ticker)}</b><small>Resultado: <span class="${clsSigno(p.realizado)}">${p.realizado >= 0 ? "+" : "−"}${ars(Math.abs(p.realizado))}</span></small></span><button class="chip" data-movs="${esc(p.ticker)}">Ver</button></div>`).join("");
  html += seccionSeguimiento();
  box.innerHTML = html;
  conectarBotones();
}

// ---------- Seguimiento (acciones que todavía no tenés) ----------
function seccionSeguimiento() {
  const filas = seguidas.map((s) => {
    const pr = precios?.tickers?.[s.ticker] || {};
    const precio = pr.ars ?? null, obj = s.precio_compra ? +s.precio_compra : null;
    const nota = datos.find((a) => a.Ticker === s.ticker)?.Puntaje;
    let estado = "";
    if (precio == null) estado = `<small>⏳ precio en la próxima actualización</small>`;
    else if (obj && precio <= obj) estado = `<small class="up"><b>✅ Llegó a tu precio de compra</b></small>`;
    else if (obj) estado = `<small>Falta bajar ${num((1 - obj / precio) * 100)}% · comprar a ${ars(obj)}</small>`;
    else estado = `<small>Sin precio de compra</small>`;
    return `<div class="arow">
      <span><b>${esc(s.ticker)}</b>${nota != null ? ` <span class="chip" style="padding:2px 7px;font-size:11px">radar ${Math.round(nota)}</span>` : ""}
        <small>${precio != null ? `Hoy ${ars(precio)}${pr.ars_prev ? ` · <span class="${clsSigno(precio - pr.ars_prev)}">${pctTxt((precio / pr.ars_prev - 1) * 100)}</span>` : ""}` : ""}${s.nota ? ` · ${esc(s.nota)}` : ""}</small>${estado}${balanceTxt(s.ticker) ? `<small>${balanceTxt(s.ticker)}</small>` : ""}</span>
      <button class="chip" data-seg="${esc(s.ticker)}">Editar</button>
    </div>`;
  }).join("");
  return `<h3>👀 Seguimiento</h3>
    ${filas || `<div class="sub" style="margin-bottom:8px">Acciones que querés comprar si bajan a cierto precio. También podés agregarlas desde el Ranking con <b>👀 Seguir</b>.</div>`}
    <button class="btn" id="btnSeguir" style="width:100%;border:0;cursor:pointer;margin-top:6px">+ Seguir una acción</button>`;
}

function formSeguimiento(ticker = "") {
  const s = seguidas.find((x) => x.ticker === ticker);
  const pr = precios?.tickers?.[ticker]?.ars;
  const nota = datos.find((a) => a.Ticker === ticker);
  abrirModal(`<h2>${s ? "Editar seguimiento" : "Seguir una acción"}</h2>
    ${nota ? `<div class="sub" style="margin-bottom:10px">${esc(nota.Empresa)} · nota radar ${Math.round(nota.Puntaje)}</div>` : ""}
    <div class="campo"><label>Ticker</label><input id="sTicker" value="${esc(ticker)}" ${s ? "disabled" : ""} autocapitalize="characters" placeholder="AAPL"></div>
    <div class="campo"><label>Avisarme si el CEDEAR baja de ($)</label><input id="sPrecio" type="number" inputmode="decimal" step="any" value="${s?.precio_compra ? +s.precio_compra : ""}" placeholder="${pr ? Math.round(pr * 0.95) : "15000"}">
      <small>${pr ? `Hoy está a ${ars(pr)}. Ejemplo: −5% sería ${ars(pr * 0.95)}.` : "Precio en pesos de 1 CEDEAR."}</small></div>
    <div class="campo"><label>Nota (opcional)</label><input id="sNota" value="${esc(s?.nota || "")}" maxlength="60" placeholder="Ej: esperar resultados"></div>
    <div id="sMsg" class="estado bad" style="display:none"></div>
    <div class="acciones">${s ? `<button id="sBorrar">Dejar de seguir</button>` : `<button id="sCancelar">Cancelar</button>`}<button class="pri" id="sGuardar">Guardar</button></div>`);
  if (s) $("sBorrar").onclick = async () => { await sb.from("seguimiento").delete().eq("ticker", ticker); cerrarModal(); renderMiCartera(); };
  else $("sCancelar").onclick = cerrarModal;
  $("sGuardar").onclick = async () => {
    const t = $("sTicker").value.trim().toUpperCase();
    if (!/^[A-Z0-9.\-]{1,10}$/.test(t)) { $("sMsg").textContent = "Escribí un ticker válido."; $("sMsg").style.display = "block"; return; }
    const fila = { ticker: t, precio_compra: +$("sPrecio").value || null, nota: $("sNota").value.trim() || null };
    const { error } = s
      ? await sb.from("seguimiento").update(fila).eq("ticker", t)
      : await sb.from("seguimiento").insert(fila);
    if (error) { $("sMsg").textContent = error.code === "23505" ? "Ya seguís esa acción." : "No se pudo guardar: " + error.message; $("sMsg").style.display = "block"; return; }
    cerrarModal(); renderMiCartera();
  };
}

// Botón "👀 Seguir" desde el Ranking
async function seguirDesdeRanking(ticker) {
  irA("cartera");
  if (!sesion) return;   // primero tiene que ingresar
  await leerPerfil();
  if (!perfil?.aprobado) return;
  if (!seguidas.length && !ops.length) await renderMiCartera();
  formSeguimiento(ticker);
}

function balanceTxt(ticker) {
  const f = precios?.tickers?.[ticker]?.balance;
  if (!f) return "";
  const dias = Math.round((Date.parse(f + "T12:00:00") - Date.parse(hoyISO() + "T12:00:00")) / 864e5);
  if (dias < 0 || dias > 45) return "";
  const d = new Date(f + "T12:00:00");
  const dia = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"][d.getDay()];
  const cuando = dias === 0 ? "hoy" : dias === 1 ? "mañana" : `en ${dias} días`;
  return `📅 Balance ${dia} ${f.slice(8, 10)}/${f.slice(5, 7)} (${cuando})`;
}

function tarjetaPos(p) {
  const sinPrecio = p.precio == null;
  const split = p.efAccion != null ? `<div class="split">Por la acción <b class="${clsSigno(p.efAccion)}">${pctTxt(p.efAccion)}</b> · por el dólar CCL <b class="${clsSigno(p.efDolar)}">${pctTxt(p.efDolar)}</b></div>` : "";
  return `<div class="pcard">
    <div class="ph">
      <div><div class="tk">${esc(p.ticker)}</div><div class="name">${num(p.cant)} CEDEARs · PPC ${ars(p.ppc)}</div></div>
      <div class="pr">${sinPrecio ? `<b>–</b><span>sin precio aún</span>` : `<b>${ars(p.precio)}</b>${p.varDia != null ? `<span class="${clsSigno(p.varDia)}">${pctTxt(p.varDia)} hoy</span>` : ""}`}</div>
    </div>
    ${sinPrecio ? `<div class="estado">⏳ El precio se actualiza cada 30 min con la bolsa abierta.</div>` : `
    <div class="gan">
      <span>Ganancia <b class="${clsSigno(p.ganPct)}">${pctTxt(p.ganPct)}</b></span>
      <span>En pesos <b class="${clsSigno(p.gan)}">${p.gan >= 0 ? "+" : "−"}${ars(Math.abs(p.gan))}</b></span>
      ${p.nota != null ? `<span>Nota radar <b>${Math.round(p.nota)}</b></span>` : ""}
    </div>
    ${split}
    ${balanceTxt(p.ticker) ? `<div class="split">${balanceTxt(p.ticker)}</div>` : ""}
    ${barraPos(p)}
    ${estadoPos(p)}`}
    ${notas[p.ticker] ? `<div class="split" style="white-space:pre-wrap">🗒️ ${esc(notas[p.ticker])}</div>` : ""}
    <div class="mini-acc">
      <button data-obj="${esc(p.ticker)}">🎯 Objetivos</button>
      <button data-movs="${esc(p.ticker)}">📋 Movimientos</button>
      <button data-nota="${esc(p.ticker)}">🗒️ Notas</button>
    </div>
  </div>`;
}

function barraPos(p) {
  const vals = [p.precio, p.ppc, p.objetivo, p.stop].filter((v) => v != null);
  const min = Math.min(...vals) * 0.98, max = Math.max(...vals) * 1.02;
  const pos = (v) => ((v - min) / (max - min || 1) * 100);
  const pp = pos(p.precio);
  return `<div class="rango">
      <div class="ppc" style="left:${pos(p.ppc).toFixed(1)}%"></div>
      <div class="mk ${pp < 15 ? "izq" : pp > 85 ? "der" : ""}" style="left:${pp.toFixed(1)}%" data-l="Hoy ${ars(p.precio)}"></div>
    </div>
    <div class="rlbl">
      <span>${p.dinamico ? `Stop dinám. <span class="sug">(−${num(+objs[p.ticker].stop_pct)}%)</span>` : `Stop${p.sugerido ? ' <span class="sug">(sug.)</span>' : ""}`}<br><b>${ars(p.stop)}</b></span>
      <span class="c">PPC<br><b>${ars(p.ppc)}</b></span>
      <span style="text-align:right">Vender${p.sugerido ? ' <span class="sug">(sug.)</span>' : ""}<br><b>${ars(p.objetivo)}</b></span>
    </div>`;
}

function estadoPos(p) {
  const falta = p.objetivo ? (p.objetivo / p.precio - 1) * 100 : null;
  const aStop = p.stop ? (1 - p.stop / p.precio) * 100 : null;
  switch (p.situacion) {
    case "objetivo": return `<div class="estado ok">🎯 Llegó a tu precio de venta</div>`;
    case "cerca_objetivo": return `<div class="estado ok">👀 Cerca del objetivo: falta ${num(falta)}%</div>`;
    case "stop": return `<div class="estado bad">🛑 Tocó tu stop</div>`;
    case "cerca_stop": return `<div class="estado warn">⚠️ Cerca del stop: está a ${num(aStop)}%</div>`;
  }
  return `<div class="estado">Faltan ${num(falta)}% para vender · stop a ${num(aStop)}%</div>`;
}

function conectarBotones() {
  $("btnCompra").onclick = () => formOperacion("compra");
  $("btnSeguir").onclick = () => formSeguimiento();
  $("carteraBox").querySelectorAll("[data-seg]").forEach((b) => b.onclick = () => formSeguimiento(b.dataset.seg));
  $("btnVenta").onclick = () => formOperacion("venta");
  $("carteraBox").querySelectorAll("[data-obj]").forEach((b) => b.onclick = () => formObjetivos(b.dataset.obj));
  $("carteraBox").querySelectorAll("[data-movs]").forEach((b) => b.onclick = () => verMovimientos(b.dataset.movs));
  $("carteraBox").querySelectorAll("[data-nota]").forEach((b) => b.onclick = () => formNota(b.dataset.nota));
}

// ---------- Ventanas (modales) ----------
function abrirModal(html) { $("hoja").innerHTML = html; $("modal").classList.add("on"); }
function cerrarModal() { $("modal").classList.remove("on"); }
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") cerrarModal(); });

function formOperacion(tipo, ticker = "") {
  const tickers = posiciones.filter((p) => p.cant > 0).map((p) => p.ticker);
  abrirModal(`<h2>${tipo === "compra" ? "Cargar compra" : "Cargar venta"}</h2>
    <div class="campo"><label>Ticker (ej: WDC, AAPL, KO)</label>
      <input id="fTicker" value="${esc(ticker || (tipo === "venta" && tickers.length === 1 ? tickers[0] : ""))}" list="misTickers" autocapitalize="characters" placeholder="WDC">
      <datalist id="misTickers">${tickers.map((t) => `<option value="${esc(t)}">`).join("")}</datalist></div>
    <div class="fila2">
      <div class="campo"><label>Fecha</label><input id="fFecha" type="date" value="${hoyISO()}" max="${hoyISO()}"></div>
      <div class="campo"><label>Cantidad de CEDEARs</label><input id="fCant" type="number" inputmode="decimal" min="0" step="any" placeholder="10"></div>
    </div>
    <div class="fila2">
      <div class="campo"><label>Precio por CEDEAR ($)</label><input id="fPrecio" type="number" inputmode="decimal" min="0" step="any" placeholder="18500"></div>
      <div class="campo"><label>Comisión total ($)</label><input id="fCom" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
    </div>
    <div class="campo"><small id="fTotal">Total: –</small></div>
    <div class="campo"><label>Broker</label>${selBroker("fBroker", ultimoBroker)}</div>
    <div class="campo"><label>📝 ¿Por qué ${tipo === "compra" ? "comprás" : "vendés"}? (opcional)</label>
      <textarea id="fNota" rows="2" maxlength="500" placeholder="${tipo === "compra" ? "Ej: buen balance, nota 85 en el radar" : "Ej: llegó a mi objetivo"}"></textarea></div>
    <div id="fMsg" class="estado" style="display:none"></div>
    <div class="acciones"><button id="fCancelar">Cancelar</button><button class="pri" id="fGuardar">Guardar</button></div>`);
  const total = () => {
    const c = +$("fCant").value || 0, pr = +$("fPrecio").value || 0, co = +$("fCom").value || 0;
    $("fTotal").textContent = "Total: " + ars(tipo === "compra" ? c * pr + co : c * pr - co, 2) + (tipo === "venta" ? " (lo que recibís)" : "");
  };
  ["fCant", "fPrecio", "fCom"].forEach((id) => $(id).oninput = total);
  $("fCancelar").onclick = cerrarModal;
  $("fGuardar").onclick = async () => {
    const fila = { ticker: $("fTicker").value.trim().toUpperCase(), tipo, fecha: $("fFecha").value,
      cantidad: +$("fCant").value, precio: +$("fPrecio").value, comision: +$("fCom").value || 0,
      broker: $("fBroker").value || null, nota: $("fNota").value.trim() || null };
    if (fila.broker) { ultimoBroker = fila.broker; try { localStorage.setItem("ultimoBroker", fila.broker); } catch {} }
    const err = (t) => { $("fMsg").textContent = t; $("fMsg").className = "estado bad"; $("fMsg").style.display = "block"; };
    if (!/^[A-Z0-9.\-]{1,10}$/.test(fila.ticker)) return err("Escribí un ticker válido (ej: WDC).");
    if (!(fila.cantidad > 0)) return err("La cantidad tiene que ser mayor a 0.");
    if (!(fila.precio > 0)) return err("El precio tiene que ser mayor a 0.");
    if (tipo === "venta") {
      const p = posiciones.find((x) => x.ticker === fila.ticker);
      if (!p || p.cant < fila.cantidad - 1e-9) return err(`No tenés ${num(fila.cantidad)} de ${fila.ticker} para vender${p ? ` (tenés ${num(p.cant)})` : ""}.`);
    }
    $("fGuardar").disabled = true;
    const { error } = await sb.from("operaciones").insert(fila);
    if (error) { $("fGuardar").disabled = false; return err("No se pudo guardar: " + error.message); }
    cerrarModal(); renderMiCartera();
  };
}

function formObjetivos(ticker) {
  const p = posiciones.find((x) => x.ticker === ticker);
  const ob = objs[ticker] || {};
  const pctDe = (v) => v && p.ppc ? pctTxt((v / p.ppc - 1) * 100) + " vs PPC" : "";
  let tipo = ob.stop_tipo === "dinamico" ? "dinamico" : "fijo";
  const maxBase = Math.max(+ob.max_precio || 0, p.ppc || 0, p.precio || 0);
  abrirModal(`<h2>Objetivos · ${esc(ticker)}</h2>
    <div class="sub" style="margin-bottom:12px">PPC ${ars(p.ppc)} · hoy ${ars(p.precio)}</div>
    <div class="campo"><label>Vender cuando llegue a ($)</label><input id="oVenta" type="number" inputmode="decimal" step="any" value="${ob.vender_en ? +ob.vender_en : Math.round(p.objetivo)}"><small id="oVentaPct">${pctDe(ob.vender_en || p.objetivo)}</small></div>
    <div class="campo"><label>Tipo de stop</label>
      <div class="ctabs" style="margin:0"><button data-t="fijo">Fijo</button><button data-t="dinamico">Dinámico</button></div></div>
    <div id="oFijo" class="campo"><label>Stop: avisarme si baja de ($)</label><input id="oStop" type="number" inputmode="decimal" step="any" value="${ob.stop ? +ob.stop : Math.round(p.stop)}"><small id="oStopPct">${pctDe(ob.stop || p.stop)}</small></div>
    <div id="oDin" class="campo"><label>Avisarme si cae este % desde su precio más alto</label><input id="oPct" type="number" inputmode="decimal" step="any" min="1" max="50" value="${ob.stop_pct ? +ob.stop_pct : SUG_STOP}">
      <small id="oDinTxt"></small>
      <small>El stop <b>sube solo</b> cuando la acción sube, y nunca baja. Sirve para proteger la ganancia.</small></div>
    <div class="campo"><small>Sugeridos: vender a +${SUG_VENTA}% y stop fijo a −${SUG_STOP}% de tu PPC.</small></div>
    <div class="acciones"><button id="oSug">Usar sugeridos</button><button class="pri" id="oGuardar">Guardar</button></div>`);
  const pintar = () => {
    $("hoja").querySelectorAll("[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === tipo));
    $("oFijo").style.display = tipo === "fijo" ? "block" : "none";
    $("oDin").style.display = tipo === "dinamico" ? "block" : "none";
    const pc = +$("oPct").value || 0;
    $("oDinTxt").innerHTML = pc > 0 ? `Precio más alto: ${ars(maxBase)} → stop hoy en <b>${ars(maxBase * (1 - pc / 100))}</b>` : "";
  };
  $("hoja").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { tipo = b.dataset.t; pintar(); });
  $("oPct").oninput = pintar;
  pintar();
  $("oVenta").oninput = () => $("oVentaPct").textContent = pctDe(+$("oVenta").value);
  $("oStop").oninput = () => $("oStopPct").textContent = pctDe(+$("oStop").value);
  $("oSug").onclick = async () => { await sb.from("objetivos").delete().eq("ticker", ticker); cerrarModal(); renderMiCartera(); };
  $("oGuardar").onclick = async () => {
    const fila = { ticker, vender_en: +$("oVenta").value || null, stop_tipo: tipo };
    if (tipo === "dinamico") {
      const pc = +$("oPct").value;
      if (!(pc > 0 && pc < 90)) return alert("Poné un % entre 1 y 89.");
      Object.assign(fila, { stop_pct: pc, stop: null, max_precio: ob.stop_tipo === "dinamico" ? maxBase : Math.max(p.ppc || 0, p.precio || 0) });
    } else {
      Object.assign(fila, { stop: +$("oStop").value || null, stop_pct: null, max_precio: null });
    }
    const { error } = await sb.from("objetivos").upsert(fila);
    if (error) return alert("No se pudo guardar: " + error.message);
    cerrarModal(); renderMiCartera();
  };
}

function verMovimientos(ticker) {
  const p = posiciones.find((x) => x.ticker === ticker);
  const movs = [...p.movs].reverse();
  abrirModal(`<h2>Movimientos · ${esc(ticker)}</h2>
    ${movs.map((o) => `<div class="mov"><span><b class="${o.tipo === "compra" ? "up" : "down"}">${o.tipo === "compra" ? "Compra" : "Venta"}</b> · ${num(+o.cantidad)} a ${ars(+o.precio)}
        <small>${o.fecha.split("-").reverse().join("/")}${+o.comision ? ` · comisión ${ars(+o.comision)}` : ""}${o.broker ? ` · 🏦 ${esc(o.broker)}` : ""}</small>
        ${o.nota ? `<small style="white-space:pre-wrap">📝 ${esc(o.nota)}</small>` : ""}</span>
        <span style="display:flex;gap:4px"><button data-edit="${o.id}" title="Editar nota y broker">✏️</button><button data-del="${o.id}" title="Borrar">🗑️</button></span></div>`).join("")}
    <div class="acciones"><button id="mCerrar">Cerrar</button><button class="pri" id="mCompra">+ Otra compra</button></div>`);
  $("mCerrar").onclick = cerrarModal;
  $("mCompra").onclick = () => formOperacion("compra", ticker);
  $("hoja").querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => formEditarMov(movs.find((o) => o.id === +b.dataset.edit), ticker));
  $("hoja").querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm("¿Borrar este movimiento?")) return;
    await sb.from("operaciones").delete().eq("id", +b.dataset.del);
    await renderMiCartera();
    if (posiciones.find((x) => x.ticker === ticker)) verMovimientos(ticker); else cerrarModal();
  });
}

function formEditarMov(o, ticker) {
  abrirModal(`<h2>${o.tipo === "compra" ? "Compra" : "Venta"} · ${esc(ticker)}</h2>
    <div class="sub" style="margin-bottom:12px">${num(+o.cantidad)} a ${ars(+o.precio)} · ${o.fecha.split("-").reverse().join("/")}</div>
    <div class="campo"><label>Broker</label>${selBroker("eBroker", o.broker || "")}</div>
    <div class="campo"><label>📝 Nota</label><textarea id="eNota" rows="3" maxlength="500" placeholder="¿Por qué hiciste esta operación?">${esc(o.nota || "")}</textarea></div>
    <div class="acciones"><button id="eVolver">Volver</button><button class="pri" id="eGuardar">Guardar</button></div>`);
  $("eVolver").onclick = () => verMovimientos(ticker);
  $("eGuardar").onclick = async () => {
    const { error } = await sb.from("operaciones").update({ broker: $("eBroker").value || null, nota: $("eNota").value.trim() || null }).eq("id", o.id);
    if (error) return alert("No se pudo guardar: " + error.message);
    await renderMiCartera(); verMovimientos(ticker);
  };
}

function formNota(ticker) {
  abrirModal(`<h2>🗒️ Notas · ${esc(ticker)}</h2>
    <div class="campo"><textarea id="nTexto" rows="7" maxlength="2000" placeholder="Ej: vender si baja de 50 mil · esperar el balance del 22/10 · me la recomendó papá">${esc(notas[ticker] || "")}</textarea></div>
    <div class="acciones"><button id="nCancelar">Cancelar</button><button class="pri" id="nGuardar">Guardar</button></div>`);
  $("nCancelar").onclick = cerrarModal;
  $("nGuardar").onclick = async () => {
    const texto = $("nTexto").value.trim();
    const { error } = texto
      ? await sb.from("notas_accion").upsert({ ticker, texto, actualizado: new Date().toISOString() })
      : await sb.from("notas_accion").delete().eq("ticker", ticker);
    if (error) return alert("No se pudo guardar: " + error.message);
    cerrarModal(); renderMiCartera();
  };
}

async function renderUsuarios() {
  const { data, error } = await sb.from("perfiles").select("id,email,nombre,aprobado,es_admin,creado").order("creado");
  if (error) { $("usuarios").innerHTML = `<div class="msg">Error: ${esc(error.message)}</div>`; return; }
  const pendientes = data.filter((u) => !u.aprobado).length;
  $("usuarios").innerHTML = (pendientes ? `<div class="estado warn" style="margin:0 0 8px">🔔 ${pendientes} esperando aprobación</div>` : "") +
    data.map((u) => `<div class="arow"><span><b>${esc(u.nombre || u.email)}</b>${u.es_admin ? ' <span class="new">ADMIN</span>' : ""}
        <small>${esc(u.email)} · ${u.aprobado ? "✅ habilitado" : "⏳ en espera"}</small></span>
        ${u.id === sesion.user.id ? "" : u.aprobado
          ? `<button class="chip" data-u="${u.id}" data-a="0">Quitar</button>`
          : `<button class="chip on" data-u="${u.id}" data-a="1">Aprobar</button>`}
      </div>`).join("");
  $("usuarios").querySelectorAll("button[data-u]").forEach((b) => b.onclick = async () => {
    if (b.dataset.a === "0" && !confirm("¿Quitarle el acceso a este usuario?")) return;
    b.disabled = true;
    await sb.from("perfiles").update({ aprobado: b.dataset.a === "1" }).eq("id", b.dataset.u);
    renderUsuarios();
  });
}

async function salir() { await sb.auth.signOut(); }

if (sb) {
  sb.auth.onAuthStateChange((_evento, s) => {
    sesion = s;
    if (s) mailPendiente = "";
    if ($("vCartera").classList.contains("on")) renderCuenta();
  });
  // Si venís del link del mail, abrir directo la pestaña de cuenta
  if (/access_token|code=|error_description/.test(location.hash + location.search)) setTimeout(() => irA("cartera"), 0);
}

let pestanas = {};  // ticker -> "a" (análisis) o "n" (noticias)

function iaNoticia(n) {
  if (!n.sentimiento) return "";
  const etq = { buena: "🟢 Buena", mala: "🔴 Mala", neutra: "⚪ Neutra" }[n.sentimiento];
  return `<div class="ia"><span class="sent ${n.sentimiento}">${etq}</span><span class="imp">impacto ${esc(n.impacto)}</span>
    ${n.explicacion ? `<button class="explicame" type="button">🤖 Explicame</button>` : ""}</div>
    ${n.explicacion ? `<div class="expl">🤖 ${esc(n.explicacion)}</div>` : ""}`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".explicame");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const box = b.parentElement.nextElementSibling;
  const on = box.classList.toggle("on");
  b.textContent = on ? "Cerrar" : "🤖 Explicame";
}, true);

function noticiasEmpresa(d) {
  if (!d.Noticias) return `<div class="none">Hay noticias solo para las primeras del ranking.</div>`;
  if (!d.Noticias.length) return `<div class="none">Sin noticias recientes.</div>`;
  return d.Noticias.map((n) => `<div class="cn"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}<small>${esc(n.fuente)}${n.fuente && hace(n.fecha) ? " · " : ""}${hace(n.fecha)}</small></a>${iaNoticia(n)}</div>`).join("");
}

const num = (v) => (Math.round(v * 10) / 10).toLocaleString("es-AR");
const califica = (n, pl) => (n >= 75 ? "muy bueno" : n >= 55 ? "aceptable" : "flojo") + (pl ? (n >= 55 && n < 75 ? "s" : "s") : "");

function motivos(d) {
  const n = d._notas || {}, f = [], m = [];
  const pe = d["P/E"], roe = d["ROE %"], deuda = d["Deuda/Pat %"], ci = d["Crec. ingresos %"],
        cg = d["Crec. ganancias %"], fcf = d["Margen FCF %"], dist = d["% sobre SMA200"], rsi = d.RSI;
  const EXPLICA = {
    "P/E": "El P/E indica cuántos años de ganancias pagás al comprar la acción. Más bajo, más barata.",
    "ROE": "Mide cuánto gana la empresa por cada $100 que pusieron sus accionistas.",
    "Deuda/Pat": "Con poca deuda la empresa aguanta mejor los años malos.",
    "Crec. ingresos": "Si las ventas suben, el negocio se está expandiendo.",
    "Crec. ganancias": "A largo plazo, el precio de la acción suele seguir a las ganancias.",
    "FCF positivo": "Es la plata que realmente le sobra: sirve para dividendos, recomprar acciones o crecer.",
    "Precio>SMA200": "La media de 200 días muestra la tendencia de fondo del último año.",
    "SMA50>SMA200": "Si la media corta está arriba de la larga, el impulso reciente es positivo.",
    "RSI en zona": "El RSI (de 0 a 100) mide si subió o bajó demasiado rápido. Lo ideal es entre 45 y 60.",
    "Volumen en alza": "El volumen es cuánto se opera. Si sube, hay más gente interesada en la acción.",
    "Cruce reciente": "Es el momento en que la acción empieza a acelerar: suma hasta 10 puntos extra a la nota técnica si pasó hace menos de 30 días.",
  };
  const esEtf = d["Nota fund"] == null;
  const regla = (k, bien, mal) => {
    if (esEtf && FUND.includes(k)) return;
    const nota = n[k] ?? 0;
    const sec = d._sector && d._sector[k];
    const extra = sec != null ? ` Promedio de su sector: ${num(sec)}${k === "P/E" ? "" : "%"}.` : "";
    if (nota >= 70 && bien) f.push([bien, EXPLICA[k] + extra]);
    else if (nota < 40 && mal) m.push([mal, EXPLICA[k] + extra]);
  };

  regla("P/E", pe && `P/E de ${num(pe)}: precio razonable para lo que gana`,
    pe == null || pe <= 0 ? "No tiene ganancias (P/E negativo o sin dato)"
    : pe < 6 ? `P/E muy bajo (${num(pe)}): puede ser una ganancia extraordinaria, conviene revisar`
    : `P/E alto (${num(pe)}): está cara respecto a lo que gana`);
  regla("ROE", roe != null && `ROE de ${num(roe)}%: muy rentable con la plata de los accionistas`,
    roe == null ? "Sin dato de ROE" : `ROE bajo (${num(roe)}%): rinde poco`);
  regla("Deuda/Pat", deuda != null && `Poca deuda (${num(deuda)}% del patrimonio)`,
    deuda == null ? "Sin dato de deuda" : `Mucha deuda (${num(deuda)}% del patrimonio)`);
  regla("Crec. ingresos", ci != null && `Ventas creciendo ${num(ci)}% anual`,
    ci == null ? "Sin dato de crecimiento de ventas" : `Ventas estancadas o cayendo (${num(ci)}%)`);
  regla("Crec. ganancias", cg != null && `Ganancias creciendo ${num(cg)}% anual`,
    cg == null ? "Sin dato de crecimiento de ganancias" : `Ganancias estancadas o cayendo (${num(cg)}%)`);
  regla("FCF positivo", fcf != null && `Genera mucho efectivo (margen ${num(fcf)}%)`,
    fcf == null ? "Sin dato de flujo de caja" : `Genera poco efectivo (margen ${num(fcf)}%)`);
  regla("Precio>SMA200", dist != null && `Tendencia alcista sana: ${num(dist)}% arriba de su media de 200 días`,
    dist == null ? null : dist < 0 ? `Tendencia bajista: está ${num(-dist)}% debajo de su media de 200 días`
    : `Muy estirada: subió ${num(dist)}% sobre su media, riesgo de corrección`);
  regla("SMA50>SMA200", "Media de 50 días arriba de la de 200: impulso alcista", "Media de 50 días debajo de la de 200: impulso bajista");
  regla("RSI en zona", rsi != null && `RSI ${num(rsi)}: zona sana, ni sobrecomprada ni sobrevendida`,
    rsi == null ? null : rsi > 60 ? `RSI ${num(rsi)}: sobrecomprada, puede corregir` : `RSI ${num(rsi)}: débil o sobrevendida`);
  regla("Volumen en alza", "Volumen en aumento: hay interés comprador", "Volumen en baja: poco interés");
  const dc = d["Días desde cruce"];
  if (dc != null && dc <= 30) f.push([dc === 0 ? "🔥 Cruce alcista hoy: la media de 50 pasó arriba de la de 200"
    : `🔥 Cruce alcista hace ${dc} día${dc === 1 ? "" : "s"}: recién empieza a acelerar`, EXPLICA["Cruce reciente"]]);

  const nf = d["Nota fund"], nt = d["Nota tec"];
  const res = esEtf ? `Sacó ${Math.round(d.Puntaje)}: es un ETF (un fondo con muchas empresas adentro), así que se califica solo por el gráfico, que está ${califica(nt, false)}.` : `Sacó ${Math.round(d.Puntaje)} porque tiene fundamentales ${califica(nf, true)} (${nf}) y un gráfico ${califica(nt, false)} (${nt}).`;
  const li = (arr, cls, ic) => arr.map(([t, e]) => `<li class="${cls}"><i>${ic}</i><span>${esc(t)}<small>${esc(e)}</small></span></li>`).join("");
  let conc;
  if (esEtf) conc = nt >= 70 ? "El fondo viene en buena tendencia." : nt >= 55 ? "Tendencia aceptable, sin mucha fuerza." : "El gráfico no acompaña por ahora.";
  else if (nf >= 70 && nt >= 70) conc = "Empresa sólida y en buen momento. Es una buena candidata para investigar más a fondo.";
  else if (nf >= 70) conc = "Buena empresa, pero el gráfico no acompaña. Puede convenir esperar un mejor momento para entrar.";
  else if (nt >= 70) conc = "El precio viene bien, pero los números de la empresa no lo respaldan del todo. Es una apuesta más especulativa.";
  else conc = "Ni los números ni el gráfico se destacan. Hay mejores opciones en el ranking.";
  return `<div class="why"><div class="res">${res}</div>
    ${f.length ? `<div class="lbl">A favor</div><ul>${li(f, "ok", "✓")}</ul>` : ""}
    ${m.length ? `<div class="lbl">En contra</div><ul>${li(m, "bad", "!")}</ul>` : ""}
    <div class="conc"><b>Conclusión</b>${conc}</div>
  </div>`;
}

function cambio(d) {
  if (d.Nueva) return `<span class="new">NUEVA</span>`;
  if (d.Cambio == null) return "";
  const c = d.Cambio;
  if (Math.abs(c) < 0.5) return `<span class="chg eq">=</span>`;
  return `<span class="chg ${c > 0 ? "up" : "down"}">${c > 0 ? "▲" : "▼"} ${num(Math.abs(c))}</span>`;
}

function fechaCorta(iso) { const [, mm, dd] = iso.split("-"); return `${dd}/${mm}`; }

function historial(d) {
  const h = d.Historial || [];
  if (h.length < 2) return `<div class="hist"><div class="top"><span>Evolución de la nota</span></div><div style="font-size:13px;color:var(--muted)">Todavía no hay historial: se arma con cada actualización diaria.</div></div>`;
  const vals = h.map((x) => x[1]);
  const min = Math.max(0, Math.min(...vals) - 5), max = Math.min(100, Math.max(...vals) + 5);
  const W = 300, H = 60;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, H - (v - min) / (max - min || 1) * H]);
  const linea = pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ");
  const ult = pts[pts.length - 1];
  const sube = vals[vals.length - 1] >= vals[0];
  const color = sube ? "var(--accent)" : "var(--low)";
  const ant = d["Puesto anterior"] ? ` · antes puesto ${d["Puesto anterior"]}` : "";
  return `<div class="hist">
    <div class="top"><span>Evolución de la nota${ant}</span><b>${num(vals[0])} → ${num(vals[vals.length - 1])}</b></div>
    <svg viewBox="-4 -4 ${W + 8} ${H + 8}" preserveAspectRatio="none">
      <polyline points="${linea}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${ult[0]}" cy="${ult[1]}" r="4" fill="${color}"/>
    </svg>
    <div class="ax"><span>${fechaCorta(h[0][0])}</span><span>${fechaCorta(h[h.length - 1][0])}</span></div>
  </div>`;
}

function tarjeta(d) {
  const p = d.Puntaje;
  const pest = pestanas[d.Ticker] || "a";
  const abierto = abiertos.has(d.Ticker);
  return `<div class="card${abierto ? " open" : ""}" data-t="${esc(d.Ticker)}">
    <div class="row">
      <div class="rank">${d.puesto}</div>
      <div class="info">
        <div class="tk">${d.Mercado === "Argentina" ? "🇦🇷 " : ""}${esc(d.Ticker)}${cambio(d)}</div>
        <div class="name">${esc(d.Empresa)} · ${esc(d.Sector || "s/d")}</div>
        <div class="bars">${d["Nota fund"] == null ? "" : barra("Fund.", d["Nota fund"])}${barra("Técn.", d["Nota tec"])}</div>
      </div>
      <div class="score" style="background:color-mix(in srgb, ${colorNota(p)} 16%, transparent);color:${colorNota(p)}">${Math.round(p)}</div>
    </div>
    <div class="detail">
      <div class="ctabs">
        <button class="${pest === "a" ? "on" : ""}" data-p="a">Análisis</button>
        <button class="${pest === "n" ? "on" : ""}" data-p="n">Noticias${d.Noticias && d.Noticias.length ? ` (${d.Noticias.length})` : ""}</button>
      </div>
      <div class="pane cnews${pest === "n" ? " on" : ""}">${noticiasEmpresa(d)}</div>
      <div class="pane${pest === "a" ? " on" : ""}">
      ${historial(d)}
      ${motivos(d)}
      <div class="grid">
        <div class="kv"><b>US$ ${fmt(d.Precio)}</b><span>Precio</span></div>
        <div class="kv"><b>${fmt(d["P/E"])}</b><span>P/E</span></div>
        <div class="kv"><b>${fmt(d["ROE %"], "%")}</b><span>ROE</span></div>
        <div class="kv"><b>${fmt(d["Deuda/Pat %"], "%")}</b><span>Deuda/Patrimonio</span></div>
        <div class="kv"><b>${fmt(d["Crec. ingresos %"], "%")}</b><span>Crec. ingresos</span></div>
        <div class="kv"><b>${fmt(d["Crec. ganancias %"], "%")}</b><span>Crec. ganancias</span></div>
        <div class="kv"><b>${fmt(d["Margen FCF %"], "%")}</b><span>Margen flujo caja</span></div>
        <div class="kv"><b>${fmt(d.RSI)}</b><span>RSI</span></div>
        <div class="kv"><b>${fmt(d["% sobre SMA200"], "%")}</b><span>Sobre SMA200</span></div>
      </div>
      ${d["Nota fund"] == null ? "" : `<h3>Fundamental · ${d["Nota fund"]}</h3>${criterios(FUND, d._notas)}`}
      <h3>Técnico · ${d["Nota tec"]}</h3>${criterios(TEC, d._notas)}
      <div class="links">
        <button class="news-btn" data-seguir="${esc(d.Ticker)}">👀 Seguir</button>
        <a href="https://finance.yahoo.com/quote/${encodeURIComponent(d.Ticker)}" target="_blank" rel="noopener">Yahoo Finance</a>
        <a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(d.Ticker.replace("-", "."))}" target="_blank" rel="noopener">Ver gráfico</a>
      </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const l = lista();
  $("list").innerHTML = l.length ? l.map(tarjeta).join("") : `<div class="empty">No hay acciones con ese filtro.</div>`;
}

function chips() {
  const sectores = ["Todos", ARG, ETF, ...[...new Set(datos.map((d) => d.Sector).filter((s) => s && s !== "ETF"))].sort()];
  $("chips").innerHTML = sectores.map((s) => `<button class="chip${s === sector ? " on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
}

$("list").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const sg = e.target.closest("[data-seguir]");
  if (sg) { seguirDesdeRanking(sg.dataset.seguir); return; }
  const tab = e.target.closest(".ctabs button");
  if (tab) {
    const c = tab.closest(".card");
    pestanas[c.dataset.t] = tab.dataset.p;
    c.querySelectorAll(".ctabs button").forEach((b) => b.classList.toggle("on", b === tab));
    const panes = c.querySelectorAll(".pane");
    panes[0].classList.toggle("on", tab.dataset.p === "n");
    panes[1].classList.toggle("on", tab.dataset.p === "a");
    return;
  }
  const card = e.target.closest(".card");
  if (!card) return;
  const t = card.dataset.t;
  abiertos.has(t) ? abiertos.delete(t) : abiertos.add(t);
  card.classList.toggle("open");
});
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  sector = c.dataset.s; chips(); render();
});
$("nchips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  filtroNoticias = c.dataset.n; renderNoticias();
});
$("tRanking").onclick = () => irA("ranking");
$("tNoticias").onclick = () => { filtroNoticias = "Todas"; irA("noticias"); };
$("tCartera").onclick = () => irA("cartera");
$("q").addEventListener("input", (e) => { busqueda = e.target.value.trim(); render(); });
$("bTop").onclick = () => { modo = "top"; $("bTop").classList.add("on"); $("bAll").classList.remove("on"); render(); };
$("bAll").onclick = () => { modo = "all"; $("bAll").classList.add("on"); $("bTop").classList.remove("on"); render(); };

fetch("data.json?v=" + Date.now())
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((j) => {
    datos = j.acciones || [];
    maxSector = j.max_por_sector ?? 3;
    $("sub").textContent = `Actualizado: ${j.actualizado} · ${datos.length} acciones analizadas`;
    chips(); render();
  })
  .catch(() => {
    $("sub").textContent = "Sin datos todavía";
    $("list").innerHTML = `<div class="msg">Todavía no hay ranking.<br>Corré la tarea "Actualizar ranking" en GitHub (pestaña Actions).</div>`;
  });
</script>
