name: Actualizar ranking

on:
  schedule:
    - cron: "30 21 * * 1-5"   # Lunes a viernes 18:30 hora Argentina (después del cierre)
  workflow_dispatch:          # Permite correrlo a mano con un botón

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install yfinance pandas requests lxml

      - name: Correr el bot
        run: python bot_acciones.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Ranking actualizado $(date +'%d/%m/%Y')" || echo "Sin cambios"
          git push
